        <div id = "body2">  
            <p> Click Here for a Random Fun Fact out of 5: </p>

            <button onclick = "showFact()"> Click here for random facts! </button>

            <p id = "fact"> <!--innerHTML goes here--> </p>

            <!-- Scripts are at the end of body -->
            <script>
                let facts = [
                "Fact 1: Mecury revolves around the sun around every 88 Earth days.",
                "Fact 2: Mecury was named after the Roman messenger god.",
                "Fact 3: Mecury is most frequently the closest planet to the sun.",
                "Fact 4: Mecury's axis tilt is the smallest of any planets in the solar system at about (1/30)°.",
                "Fact 5: Galileo Galilei's first planet to be viewed by a telescope is Mercury."
                ];

            function showFact()
            {
                let random_num = Math.floor(Math.random() * facts.length);
                document.getElementById("fact").innerHTML = facts[random_num];
            }
            </script>
